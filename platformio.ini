[platformio]
description = Static task-set with static priority cooperative scheduling loop with no preemption
default_envs = native

[env]
platform_packages =
    toolchain-gccarmnoneeabi@1.140201.0
test_build_src = yes

build_src_flags =
    -std=c++23
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -fno-threadsafe-statics
    -fno-use-cxa-atexit

[env:native]
platform = native

; Sanitizer runs of the host test suite. ASan/UBSan catch the memory- and
; integer-overflow classes (a runaway proactor countdown lands here); TSan
; covers the ISR<->task boundary that `test_concurrent` models with real
; threads against the mutex-backed hosted `critical_section`.
; build_flags reaches every translation unit, tests included, and the link. A finding
; aborts rather than scrolling past, so it fails `pio test`.
[sanitizer]
flags = -g -O1 -fno-omit-frame-pointer -fno-optimize-sibling-calls -fno-sanitize-recover=all

[env:native_asan]
platform = native
build_flags = ${sanitizer.flags} -fsanitize=address,undefined

[env:native_tsan]
platform = native
build_flags = ${sanitizer.flags} -fsanitize=thread

; A clock and a line editor in the terminal, run from a terminal so that it can draw:
;   pio run -e basic_example && .pio/build/basic_example/program
[env:basic_example]
platform = native
build_src_filter = +<*> +<../examples/basic_example.cpp>

; The hardware self-test in examples/nucleo_f446re.cpp, flashed over the on-board ST-LINK:
;   pio run -e nucleo_f446re -t upload && pio device monitor -e nucleo_f446re
[env:nucleo_f446re]
board = nucleo_f446re
platform = ststm32
framework = stm32cube
build_src_filter = +<*> +<../examples/nucleo_f446re.cpp>
monitor_speed = 115200
; library.json runs the frame check only where corosched is a dependency, not in this project itself.
extra_scripts = post:scripts/frame_check.py

; Every core the library supports: the test suite compiled with this core's GCC and
; linked, so an atomic the core has no instruction for fails on the libatomic call it
; turns into. It cannot run, and nothing here is meant to be flashed: the board only
; gets the platform to run, and build.cpu picks the core. There is no pio run for
; these, since the only main is in the tests. libnosys stubs out what libc wants from
; an OS; each stub needs its -u, or the link still reports it undefined.
;
;   pio test --without-uploading --without-testing -e cortex-m0 -e cortex-m0plus -e cortex-m1 -e cortex-m3 -e cortex-m4 -e cortex-m7 -e cortex-m23 -e cortex-m33 -e cortex-m35p -e cortex-m52 -e cortex-m55 -e cortex-m85
[cortex_m]
platform = ststm32
board = genericSTM32F446RE
; no_ticks.cpp gives the cores with no default tick source the stataider hooks.
build_src_filter = +<*> +<../test/support/no_ticks.cpp>
build_src_flags =
    ${env.build_src_flags}
    -Werror
build_flags = -lnosys -Wl,-u,_exit -Wl,-u,_kill -Wl,-u,_getpid
; test_concurrent needs threads.
test_ignore = test_concurrent

[env:cortex-m0]
extends = cortex_m
board_build.cpu = cortex-m0

[env:cortex-m0plus]
extends = cortex_m
board_build.cpu = cortex-m0plus

[env:cortex-m1]
extends = cortex_m
board_build.cpu = cortex-m1

[env:cortex-m3]
extends = cortex_m
board_build.cpu = cortex-m3

[env:cortex-m4]
extends = cortex_m
board_build.cpu = cortex-m4

[env:cortex-m7]
extends = cortex_m
board_build.cpu = cortex-m7

[env:cortex-m23]
extends = cortex_m
board_build.cpu = cortex-m23

[env:cortex-m33]
extends = cortex_m
board_build.cpu = cortex-m33

[env:cortex-m35p]
extends = cortex_m
board_build.cpu = cortex-m35p

[env:cortex-m52]
extends = cortex_m
board_build.cpu = cortex-m52

[env:cortex-m55]
extends = cortex_m
board_build.cpu = cortex-m55

[env:cortex-m85]
extends = cortex_m
board_build.cpu = cortex-m85
